<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreenWheel Auto - Create Account</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              bg: "#0B0D0C",
              surface: "#16191A",
              ink: "#F5F6F2",
              accent: "#C4F135",
              circuit: "#4FD1E8",
              line: "#2A2D2A",
              muted: "#9AA39C",
            },
            fontFamily: {
              display: ["'Space Grotesk'", "sans-serif"],
              body: ["'Inter'", "sans-serif"],
              mono: ["'IBM Plex Mono'", "monospace"],
            },
            borderRadius: { card: "1rem" },
          },
        },
      };
    </script>
    <style>
      .bg-decor {
        position: fixed;
        inset: 0;
        z-index: -10;
        background-image: url('/images/bg.png');
        background-size: cover;
        background-position: center;
        filter: blur(15px);
        transform: scale(1.05);
        opacity: 1;
        pointer-events: none;
      }
      .bg-decor-overlay {
        position: fixed;
        inset: 0;
        z-index: -9;
        background: rgba(10, 5, 12, 0.75);
        pointer-events: none;
      }

      body { font-family: 'Inter', sans-serif; background-color: #0B0D0C; color: #F5F6F2; }
      h1, h2, h3, h4 { font-family: 'Space Grotesk', sans-serif; }
      .spec-mono { font-family: 'IBM Plex Mono', monospace; }
      .hero-glow { background: radial-gradient(60% 60% at 50% 0%, rgba(196,241,53,0.10), transparent 70%); }

      input {
        background-color: #0B0D0C;
        border: 1px solid #2A2D2A;
        color: #F5F6F2;
      }
      input:focus {
        outline: none;
        border-color: #C4F135;
      }
      input::placeholder { color: #6B7280; }

      .btn-primary {
        background-color: #C4F135;
        color: #0B0D0C;
        font-weight: 600;
        padding: 0.75rem 1.5rem;
        border-radius: 1rem;
        transition: opacity 0.2s;
        border: none;
        width: 100%;
        font-size: 1rem;
        cursor: pointer;
      }
      .btn-primary:hover { opacity: 0.85; }
    </style>
</head>
<body class="bg-bg text-ink font-body">
    <div class="bg-decor"></div>
    <div class="bg-decor-overlay"></div>

    <section class="hero-glow min-h-screen flex flex-col items-center justify-center px-4 py-16">

        <a href="/catalogue.html" class="mb-6">
            <img src="/images/logo.png" alt="GreenWheel Auto" class="h-20 w-auto mx-auto" />
        </a>

        <div class="w-full max-w-md">
            <p class="spec-mono text-circuit text-xs tracking-widest uppercase mb-2 text-center">Join GreenWheel Auto</p>
            <h1 class="text-3xl md:text-4xl font-display font-bold text-center mb-8">Create Account</h1>

            <div class="bg-surface border border-line rounded-card p-8">
                <form id="registerForm" class="space-y-5" onsubmit="return false;">
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-muted mb-1">First Name</label>
                            <input type="text" id="fname" placeholder="Jane" required
                                   class="w-full rounded-lg px-4 py-3 focus:outline-none" />
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-muted mb-1">Last Name</label>
                            <input type="text" id="lname" placeholder="Doe" required
                                   class="w-full rounded-lg px-4 py-3 focus:outline-none" />
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-muted mb-1">Email</label>
                        <input type="email" id="email" placeholder="jane@example.com" required
                               class="w-full rounded-lg px-4 py-3 focus:outline-none" />
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-muted mb-1">Password</label>
                        <input type="password" id="password" placeholder="••••••••" required
                               class="w-full rounded-lg px-4 py-3 focus:outline-none" />
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-muted mb-1">Address</label>
                        <input type="text" id="address" placeholder="123 Main St, Toronto, ON"
                               class="w-full rounded-lg px-4 py-3 focus:outline-none" />
                    </div>

                    <button type="submit" onclick="registerUser()" class="btn-primary">Register</button>

                    <p id="message" class="text-sm text-red-400 text-center min-h-[1.25rem]"></p>
                </form>

                <p class="text-sm text-muted text-center mt-2">
                    Already have an account?
                    <a href="login.html" class="text-accent hover:underline">Login here</a>
                </p>
            </div>
        </div>
    </section>

    <script>
        const API = 'http://localhost:5000/api/auth';

        async function registerUser() {
            const fname    = document.getElementById('fname').value;
            const lname    = document.getElementById('lname').value;
            const email    = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const address  = document.getElementById('address').value;
            const messageEl = document.getElementById('message');

            if (!fname || !lname || !email || !password) {
                messageEl.textContent = 'Please fill in all required fields.';
                return;
            }

            try {
                const res = await fetch(`${API}/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ fname, lname, email, password, address })
                });

                const data = await res.json();

                if (res.ok) {
                    // Success -> redirect to Login page
                    window.location.href = 'login.html';
                } else {
                    messageEl.textContent = data.message || 'Registration failed.';
                }
            } catch (err) {
                messageEl.textContent = 'Error connecting to server.';
            }
        }
    </script>
</body>
</html>
