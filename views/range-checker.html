<!DOCTYPE html>
<html>
<head>
    <title>GreenWheel Auto - Range Suitability Checker</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              bg: "#0B0D0C",
              surface: "#16191A",
              ink: "#F5F6F2",
              accent: "#C4F135",
              circuit: "#4FD1E8",
              line: "#2A2D2A",
              muted: "#9AA39C",
            },
            fontFamily: {
              display: ["'Space Grotesk'", "sans-serif"],
              body: ["'Inter'", "sans-serif"],
              mono: ["'IBM Plex Mono'", "monospace"],
            },
            borderRadius: { card: "1rem" },
          },
        },
      };
    </script>
    <style>
      .bg-decor {
        position: fixed;
        inset: 0;
        z-index: -10;
        background-image: url('/images/bg.png');
        background-size: cover;
        background-position: center;
        filter: blur(5px);
        transform: scale(1.05);
        opacity: 1;
        pointer-events: none;
      }
      .bg-decor-overlay {
        position: fixed;
        inset: 0;
        z-index: -9;
        background: rgba(10, 5, 12, 0.75);
        pointer-events: none;
      }
      
      body { font-family: 'Inter', sans-serif; background-color: #0B0D0C; color: #F5F6F2; }
      h1, h2, h3, h4 { font-family: 'Space Grotesk', sans-serif; }
      .spec-mono { font-family: 'IBM Plex Mono', monospace; }
      .charge-bar-track { width: 100%; height: 5px; border-radius: 9999px; background-color: #2A2D2A; overflow: hidden; }
      .charge-bar-fill { height: 100%; background: linear-gradient(90deg, #4FD1E8, #C4F135); border-radius: 9999px; transition: width 0.6s ease; }
      .hero-glow { background: radial-gradient(60% 60% at 50% 0%, rgba(196,241,53,0.10), transparent 70%); }
      ::-webkit-scrollbar { height: 8px; }
      ::-webkit-scrollbar-thumb { background: #2A2D2A; border-radius: 8px; }
      
      .result-card {
        background: #16191A;
        border: 1px solid #2A2D2A;
        border-radius: 1rem;
        padding: 1.5rem;
        transition: all 0.3s ease;
      }
      .result-card:hover {
        border-color: #C4F135;
        transform: translateY(-2px);
      }
      .result-card.suitable { border-left: 4px solid #C4F135; }
      .result-card.borderline { border-left: 4px solid #F59E0B; }
      .result-card.not-recommended { border-left: 4px solid #EF4444; }
      
      .status-badge {
        font-family: 'IBM Plex Mono', monospace;
        font-weight: 600;
        padding: 0.25rem 0.75rem;
        border-radius: 9999px;
        font-size: 0.75rem;
      }
      .status-badge.suitable { background: rgba(196, 241, 53, 0.15); color: #C4F135; }
      .status-badge.borderline { background: rgba(245, 158, 11, 0.15); color: #F59E0B; }
      .status-badge.not-recommended { background: rgba(239, 68, 68, 0.15); color: #EF4444; }
      
      input, select {
        background-color: #0B0D0C;
        border: 1px solid #2A2D2A;
        color: #F5F6F2;
      }
      input:focus, select:focus {
        outline: none;
        border-color: #C4F135;
      }
      input::placeholder {
        color: #6B7280;
      }
    </style>
</head>
<body class="bg-bg text-ink font-body">
    <div class="bg-decor"></div>
    <div class="bg-decor-overlay"></div>

    <!-- NAVBAR -->
    <header class="sticky top-0 z-50 pt-3 pb-3 px-2 sm:px-4 bg-bg/60 backdrop-blur-sm">
      <div class="max-w-6xl mx-auto flex items-center justify-between gap-4">

        <!-- ✅ Fixed: /images/logo.png (not /public/images/) -->
        <a href="/catalogue.html" class="flex items-center shrink-0 -ml-1">
          <img src="/images/logo.png" alt="GreenWheel Auto" class="h-24 w-auto" />
        </a>

        <nav class="hidden md:flex items-center gap-1 bg-white/5 backdrop-blur-xl border border-white/10 rounded-full px-2 py-1.5">
          <a href="/catalogue.html" class="px-4 py-2 rounded-full text-sm font-medium text-muted hover:text-ink hover:bg-white/5 transition-colors">Browse</a>
          <a href="/range-checker.html" class="px-4 py-2 rounded-full text-sm font-medium bg-accent/15 text-accent">Range Checker</a>
          <a href="/cart.html" class="px-4 py-2 rounded-full text-sm font-medium text-muted hover:text-ink hover:bg-white/5 transition-colors">Cart</a>
        </nav>

        <div id="nav-auth-area" class="shrink-0 text-sm"></div>
      </div>
    </header>

    <!-- REST OF YOUR HTML (same as before) -->

</body>
</html>
