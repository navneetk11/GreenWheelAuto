<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart | GreenWheel Auto</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              bg: "#0B0D0C", surface: "#16191A", ink: "#F5F6F2",
              accent: "#C4F135", circuit: "#4FD1E8", line: "#2A2D2A", muted: "#9AA39C",
            },
            fontFamily: {
              display: ["'Space Grotesk'", "sans-serif"],
              body: ["'Inter'", "sans-serif"],
              mono: ["'IBM Plex Mono'", "monospace"],
            },
            borderRadius: { card: "1rem" },
          },
        },
      };
    </script>
    <style>
      .bg-decor {
        position: fixed; inset: 0; z-index: -10;
        background-image: url('/images/bg.png');
        background-size: cover; background-position: center;
        filter: blur(15px); transform: scale(1.05); opacity: 0.5;
        pointer-events: none;
      }
      .bg-decor-overlay {
        position: fixed; inset: 0; z-index: -9;
        background: rgba(10, 5, 12, 0.65);
        pointer-events: none;
      }
      body { font-family: 'Inter', sans-serif; background-color: #0B0D0C; color: #F5F6F2; }
      h1, h2, h3 { font-family: 'Space Grotesk', sans-serif; }
      .spec-mono { font-family: 'IBM Plex Mono', monospace; }
    </style>
</head>
<body class="bg-bg text-ink font-body">
  <div class="bg-decor"></div>
  <div class="bg-decor-overlay"></div>

  <header class="sticky top-0 z-50 pt-3 pb-3 px-2 sm:px-4 bg-bg/60 backdrop-blur-sm">
    <div class="max-w-6xl mx-auto flex items-center justify-between gap-4">
      <a href="/catalogue.html" class="flex items-center shrink-0 -ml-1">
        <img src="/images/logo.png" alt="GreenWheel Auto" class="h-14 w-auto" />
      </a>
      <nav class="hidden md:flex items-center gap-1 bg-white/5 backdrop-blur-xl border border-white/10 rounded-full px-2 py-1.5">
        <a href="/catalogue.html" class="px-4 py-2 rounded-full text-sm font-medium text-muted hover:text-ink hover:bg-white/5 transition-colors">Browse</a>
        <a href="/range-checker.html" class="px-4 py-2 rounded-full text-sm font-medium text-muted hover:text-ink hover:bg-white/5 transition-colors">Range Checker</a>
        <a href="/cart.html" class="px-4 py-2 rounded-full text-sm font-medium bg-accent/15 text-accent">Cart</a>
        <a href="/loan-calculator.html" class="px-4 py-2 rounded-full text-sm font-medium text-muted hover:text-ink hover:bg-white/5 transition-colors">Loan Calculator</a>
      </nav>
      <div id="nav-auth-area" class="shrink-0 text-sm"></div>
    </div>
  </header>

  <div class="max-w-3xl mx-auto px-4 py-10">
    <h1 class="text-3xl font-display font-bold mb-1">Your Shopping Cart</h1>
    <p class="text-muted mb-6">Review your selected vehicles before continuing to checkout.</p>

    <div id="statusMessage" class="text-sm text-circuit mb-4"></div>

    <div id="cartContainer" class="space-y-4 mb-8">
      <p class="text-muted">Loading your cart...</p>
    </div>

    <div class="bg-surface border border-line rounded-card p-6">
      <div class="flex items-center justify-between mb-5">
        <h2 class="text-xl font-display font-bold">Order Total</h2>
        <p id="cartTotal" class="spec-mono text-2xl font-semibold text-accent">$0.00</p>
      </div>
      <div class="flex gap-3">
        <button type="button" onclick="window.location.href='catalogue.html'"
          class="flex-1 border border-line px-5 py-3 rounded-card text-sm text-muted hover:text-ink hover:border-accent transition-colors">
          Continue Shopping
        </button>
        <button type="button" id="checkoutButton" onclick="goToCheckout()" disabled
          class="flex-1 bg-accent text-bg font-semibold px-5 py-3 rounded-card hover:opacity-90 transition-opacity disabled:opacity-40 disabled:cursor-not-allowed">
          Proceed to Checkout
        </button>
      </div>
    </div>
  </div>

  <script>
    function getToken() { return localStorage.getItem('token'); }

    function formatCurrency(value) {
        return Number(value).toLocaleString('en-CA', { style: 'currency', currency: 'CAD' });
    }

    function showMessage(message) { document.getElementById('statusMessage').textContent = message; }
    function clearMessage() { document.getElementById('statusMessage').textContent = ''; }

    async function loadCart() {
        const token = getToken();
        const container = document.getElementById('cartContainer');
        const checkoutButton = document.getElementById('checkoutButton');

        clearMessage();

        if (!token) {
            container.innerHTML = `<p class="text-muted">Please sign in to view your shopping cart.</p>`;
            checkoutButton.disabled = true;
            return;
        }

        container.innerHTML = '<p class="text-muted">Loading your cart...</p>';

        try {
            const response = await fetch('/api/cart', {
                headers: { Authorization: 'Bearer ' + token }
            });
            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error || 'Your cart could not be loaded.');
            }

            renderCart(data.items, data.total);

        } catch (error) {
            console.error(error);
            container.innerHTML = `<p class="text-muted">We could not load your cart.</p>`;
            document.getElementById('cartTotal').textContent = '$0.00';
            checkoutButton.disabled = true;
            showMessage('Something went wrong while loading your cart. Please try again.');
        }
    }

    function renderCart(items, total) {
        const container = document.getElementById('cartContainer');
        const checkoutButton = document.getElementById('checkoutButton');

        if (!items || items.length === 0) {
            container.innerHTML = `
                <div class="bg-surface border border-line rounded-card p-10 text-center">
                    <h2 class="text-xl font-display font-bold mb-2">Your cart is empty</h2>
                    <p class="text-muted">Browse our vehicle catalogue to find a vehicle.</p>
                </div>
            `;
            document.getElementById('cartTotal').textContent = '$0.00';
            checkoutButton.disabled = true;
            return;
        }

        let cartHtml = '';

        for (const item of items) {
            const vehicleName = (item.brand || item.make || 'Vehicle') + ' ' + (item.model || '');

            cartHtml += `
                <div class="bg-surface border border-line rounded-card p-5 flex items-center justify-between flex-wrap gap-4">
                    <div>
                        <h3 class="font-display font-semibold text-ink mb-1">${vehicleName}</h3>
                        <p class="text-sm text-muted">Price: <span class="spec-mono text-ink">${formatCurrency(item.price)}</span></p>
                        <p class="text-sm text-muted">Item total: <span class="spec-mono text-accent">${formatCurrency(Number(item.price) * Number(item.quantity))}</span></p>
                    </div>
                    <div class="flex items-center gap-2">
                        <button type="button" onclick="changeQuantity(${item.cartItemId}, ${item.quantity - 1})"
                            ${item.quantity <= 1 ? 'disabled' : ''}
                            class="w-8 h-8 border border-line rounded-card text-ink hover:border-accent disabled:opacity-30 disabled:cursor-not-allowed">−</button>
                        <span class="spec-mono w-6 text-center">${item.quantity}</span>
                        <button type="button" onclick="changeQuantity(${item.cartItemId}, ${item.quantity + 1})"
                            class="w-8 h-8 border border-line rounded-card text-ink hover:border-accent">+</button>
                        <button type="button" onclick="removeItem(${item.cartItemId})"
                            class="ml-2 text-sm text-red-400 hover:underline">Remove</button>
                    </div>
                </div>
            `;
        }

        container.innerHTML = cartHtml;
        document.getElementById('cartTotal').textContent = formatCurrency(total);
        checkoutButton.disabled = false;
    }

    async function changeQuantity(cartItemId, quantity) {
        if (quantity < 1) return;
        const token = getToken();

        try {
            const response = await fetch('/api/cart/' + cartItemId, {
                method: 'PUT',
                headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
                body: JSON.stringify({ quantity })
            });
            const data = await response.json();
            if (!response.ok) throw new Error(data.error || 'The quantity could not be updated.');
            showMessage('Cart quantity updated.');
            await loadCart();
        } catch (error) {
            console.error(error);
            showMessage(error.message);
        }
    }

    async function removeItem(cartItemId) {
        const shouldRemove = window.confirm('Remove this vehicle from your cart?');
        if (!shouldRemove) return;
        const token = getToken();

        try {
            const response = await fetch('/api/cart/' + cartItemId, {
                method: 'DELETE',
                headers: { Authorization: 'Bearer ' + token }
            });
            const data = await response.json();
            if (!response.ok) throw new Error(data.error || 'The item could not be removed.');
            showMessage('The vehicle was removed from your cart.');
            await loadCart();
        } catch (error) {
            console.error(error);
            showMessage(error.message);
        }
    }

    function goToCheckout() { window.location.href = 'checkout.html'; }

    const user = JSON.parse(localStorage.getItem('user') || 'null');
    const authArea = document.getElementById('nav-auth-area');
    authArea.innerHTML = user
      ? `<div class="flex items-center gap-3">
           <span class="text-muted">Welcome, ${user.fname}!</span>
           <button onclick="logout()" class="text-circuit hover:underline">Sign out</button>
         </div>`
      : `<a href="/login.html" class="bg-accent text-bg font-medium px-4 py-1.5 rounded-card hover:opacity-90">Login / Register</a>`;

    function logout() {
        localStorage.removeItem('token');
        localStorage.removeItem('user');
        window.location.href = 'login.html';
    }

    loadCart();
  </script>
  <script src="/chatbot.js"></script>
</body>
</html>
