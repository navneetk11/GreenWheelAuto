<!DOCTYPE html>
<html>
<head>
    <title>GreenWheel Auto - Vehicle Detail</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              bg: "#0B0D0C", surface: "#16191A", ink: "#F5F6F2",
              accent: "#C4F135", circuit: "#4FD1E8", line: "#2A2D2A", muted: "#9AA39C",
            },
            fontFamily: {
              display: ["'Space Grotesk'", "sans-serif"],
              body: ["'Inter'", "sans-serif"],
              mono: ["'IBM Plex Mono'", "monospace"],
            },
            borderRadius: { card: "1rem" },
          },
        },
      };
    </script>
    <style>
     .bg-decor {
  position: fixed;
  inset: 0;
  z-index: -10;
  background-image: url('/images/bg.png');
  background-size: cover;
  background-position: center;
  filter: blur(15px);
  transform: scale(1.05);
  opacity: 1;
  pointer-events: none;
}
.bg-decor-overlay {
  position: fixed;
  inset: 0;
  z-index: -9;
  background: rgba(10, 5, 12, 0.75);
  pointer-events: none;
}
      body { font-family: 'Inter', sans-serif; background-color: #0B0D0C; color: #F5F6F2; }
      h1, h2, h3, h4 { font-family: 'Space Grotesk', sans-serif; }
      .spec-mono { font-family: 'IBM Plex Mono', monospace; }
      .charge-bar-track { width: 100%; height: 5px; border-radius: 9999px; background-color: #2A2D2A; overflow: hidden; }
      .charge-bar-fill { height: 100%; background: linear-gradient(90deg, #4FD1E8, #C4F135); border-radius: 9999px; }
    </style>
</head>
<body class="bg-bg text-ink font-body">
    <div class="bg-decor"></div>
<div class="bg-decor-overlay"></div>

  <header class="sticky top-0 z-50 py-2 px-2 sm:px-4 bg-bg/60 backdrop-blur-sm">
    <div class="max-w-6xl mx-auto flex items-center justify-between gap-4">
      <a href="/catalogue.html" class="flex items-center shrink-0 -ml-1">
        <img src="/images/logo.png" alt="GreenWheel Auto" class="h-24 w-auto" />
      </a>
      <nav class="hidden md:flex items-center gap-1 bg-white/5 backdrop-blur-xl border border-white/10 rounded-full px-2 py-1.5">
        <a href="/catalogue.html" class="px-4 py-2 rounded-full text-sm font-medium bg-accent/15 text-accent">Browse</a>
        <a href="/range-checker.html" class="px-4 py-2 rounded-full text-sm font-medium text-muted hover:text-ink hover:bg-white/5 transition-colors">Range Checker</a>
        <a href="/cart.html" class="px-4 py-2 rounded-full text-sm font-medium text-muted hover:text-ink hover:bg-white/5 transition-colors">Cart</a>
        <a href="/loan-calculator.html" class="px-4 py-2 rounded-full text-sm font-medium text-muted hover:text-ink hover:bg-white/5 transition-colors">Loan Calculator</a>
      </nav>
      <div id="nav-auth-area" class="shrink-0 text-sm"></div>
    </div>
  </header>

  <div class="max-w-5xl mx-auto px-4 py-6">
    <a href="catalogue.html" class="inline-flex items-center gap-1.5 text-sm font-medium text-ink bg-surface border border-line px-3 py-1.5 rounded-card hover:border-accent hover:text-accent transition-colors mb-4">
  ← Back to catalogue
</a>
    <div id="cart-message"></div>
    <div id="vehicle-detail"></div>

    <!-- NEW: reviews section, rendered separately from vehicle-detail so
         re-fetching reviews doesn't require re-rendering the vehicle info -->
    <div id="reviews-section" class="mt-8"></div>
  </div>

  <script>
    const API = 'http://localhost:5000/api/vehicles';
    const REVIEWS_API = 'http://localhost:5000/api/reviews';

    const params = new URLSearchParams(window.location.search);
    const vid = params.get('vid');

    async function loadVehicle() {
        if (!vid) {
            document.getElementById('vehicle-detail').innerHTML =
                '<p class="text-muted">No vehicle selected.</p>';
            return;
        }

        const res = await fetch(`${API}/${vid}`);
        const v = await res.json();

        const rangeKm = v.range_km || 0;
        const rangePercent = Math.min(100, Math.round((rangeKm / 700) * 100));
        const imageUrl = v.image_url || '/images/vehicles/placeholder.jpg';

        const specs = [
            ['Mileage', `${v.mileage} km`],
            ['Winter range', `${v.range_winter_km} km`],
            ['Drive type', v.drive_type],
            ['Exterior color', v.exterior_color],
            ['Interior color', v.interior_color],
            ['Interior fabric', v.interior_fabric],
            ['Charging speed', v.charging_speed],
            ['Accident reported', v.accident_reported ? 'Yes' : 'None'],
        ];

        document.getElementById('vehicle-detail').innerHTML = `
            <div class="grid md:grid-cols-2 gap-8">
             <div class="bg-surface border border-line rounded-card overflow-hidden aspect-[4/3]">
    <img src="${imageUrl}" alt="${v.brand} ${v.model}" class="w-full h-full object-cover" />
</div>

                <div>
                    <span class="inline-block bg-bg border border-line text-circuit text-xs font-mono px-2 py-1 rounded mb-3">
                        ${v.condition_type}
                    </span>
                    <h1 class="text-3xl font-display font-bold mb-1">${v.brand} ${v.model} ${v.year}</h1>
                    <p class="text-muted mb-4">${v.shape}</p>

                    <p class="spec-mono text-3xl font-semibold mb-4">$${Number(v.price).toLocaleString()}</p>

                    <div class="mb-2 flex items-center justify-between spec-mono text-circuit text-sm">
                        <span>⚡ ${rangeKm}km range</span>
                    </div>
                    <div class="charge-bar-track mb-6">
                        <div class="charge-bar-fill" style="width: ${rangePercent}%"></div>
                    </div>

                    <div class="flex gap-3 mb-8">
                        <button onclick="addToCart('${v.vid}', '${v.brand} ${v.model}', ${v.price})"
                            class="flex-1 bg-accent text-bg font-semibold px-5 py-3 rounded-card hover:opacity-90 transition-opacity">
                            Add to cart
                        </button>
                        <a href="range-checker.html"
                           class="flex-1 text-center border border-line px-5 py-3 rounded-card text-sm text-muted hover:text-ink hover:border-accent transition-colors">
                            Check range suitability
                        </a>
                    </div>

                    <div class="bg-surface border border-line rounded-card p-5 grid grid-cols-2 gap-x-6 gap-y-3">
                        ${specs.map(([label, value]) => `
                            <div>
                                <div class="text-xs text-muted mb-0.5">${label}</div>
                                <div class="spec-mono text-sm text-ink">${value}</div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            </div>
        `;
    }

    function addToCart(vid, name, price) {
        const token = localStorage.getItem('token');
        if (!token) {
            alert('Please login first!');
            window.location.href = 'login.html';
            return;
        }

        fetch('http://localhost:5000/api/cart', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify({ vehicleId: vid, quantity: 1 })
        })
        .then(res => res.json())
        .then(data => {
            document.getElementById('cart-message').innerHTML = `
                <div class="bg-surface border border-accent/40 rounded-card p-4 mb-4 flex items-center justify-between flex-wrap gap-3">
                    <p class="text-sm">${name} added to cart!</p>
                    <div class="flex gap-2">
                        <button onclick="window.location.href='cart.html'"
                            class="bg-accent text-bg text-sm font-medium px-4 py-1.5 rounded-card hover:opacity-90">
                            View cart
                        </button>
                        <button onclick="window.location.href='catalogue.html'"
                            class="border border-line text-sm text-muted px-4 py-1.5 rounded-card hover:text-ink">
                            Continue shopping
                        </button>
                    </div>
                </div>
            `;
        })
        .catch(err => {
            alert('Error adding to cart');
        });
    }

    // Reviews
    function renderStars(rating) {
        const rounded = Math.round(Number(rating));
        return '★'.repeat(rounded) + '☆'.repeat(5 - rounded);
    }

    async function loadReviews() {
        if (!vid) return;

        const res = await fetch(`${REVIEWS_API}/${vid}`);
        const data = await res.json();
        const token = localStorage.getItem('token');

        const avgDisplay = data.average
            ? `<span class="text-accent text-lg">${renderStars(data.average)}</span>
               <span class="spec-mono text-sm text-muted ml-2">${data.average} / 5 (${data.count} review${data.count === 1 ? '' : 's'})</span>`
            : `<span class="text-muted text-sm">No reviews yet — be the first.</span>`;

        const reviewsHtml = data.reviews.length
            ? data.reviews.map(r => `
                <div class="border-b border-line py-4 last:border-0">
                    <div class="flex items-center justify-between mb-1">
                        <span class="font-medium text-ink">${r.fname} ${r.lname}</span>
                        <span class="text-accent text-sm">${renderStars(r.rating)}</span>
                    </div>
                    <p class="text-xs text-muted mb-1.5">${new Date(r.created_at).toLocaleDateString()}</p>
                    <p class="text-sm text-ink">${r.comment}</p>
                </div>
            `).join('')
            : '';

        
        const reviewFormHtml = token ? `
            <div class="mt-6">
                <button id="toggleReviewFormBtn" onclick="toggleReviewForm()"
                    class="border border-line px-4 py-2 rounded-card text-sm text-muted hover:text-ink hover:border-accent transition-colors">
                    Leave a Review
                </button>
                <form id="reviewForm" class="hidden mt-4 bg-bg border border-line rounded-card p-5" onsubmit="submitReview(event)">
                    <label class="block text-sm text-muted mb-1">Your rating</label>
                    <select id="reviewRating" required
                        class="bg-surface border border-line rounded px-3 py-1.5 text-sm text-ink mb-3 focus:outline-none focus:border-accent">
                        <option value="">Select...</option>
                        <option value="5">★★★★★ (5)</option>
                        <option value="4">★★★★☆ (4)</option>
                        <option value="3">★★★☆☆ (3)</option>
                        <option value="2">★★☆☆☆ (2)</option>
                        <option value="1">★☆☆☆☆ (1)</option>
                    </select><br>
                    <label class="block text-sm text-muted mb-1">Your review</label>
                    <textarea id="reviewComment" required rows="3"
                        class="w-full bg-surface border border-line rounded px-3 py-2 text-sm text-ink mb-3 focus:outline-none focus:border-accent"
                        placeholder="What did you think of this vehicle?"></textarea><br>
                    <button type="submit" class="bg-accent text-bg font-semibold px-5 py-2 rounded-card hover:opacity-90 transition-opacity">
                        Submit Review
                    </button>
                    <span id="reviewFormMessage" class="text-sm ml-3"></span>
                </form>
            </div>
        ` : `
            <p class="text-sm text-muted mt-6">
                <a href="login.html" class="text-circuit hover:underline">Log in</a> to leave a review.
            </p>
        `;

        document.getElementById('reviews-section').innerHTML = `
            <div class="bg-surface border border-line rounded-card p-6">
                <h2 class="text-xl font-display font-bold mb-2">Reviews</h2>
                <div class="mb-4">${avgDisplay}</div>
                <div>${reviewsHtml}</div>
                ${reviewFormHtml}
            </div>
        `;

        // Open review form after checkout
        if (params.get('justOrdered') && token) {
            toggleReviewForm(true);
            document.getElementById('reviewForm')?.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
    }

    function toggleReviewForm(forceOpen) {
        const form = document.getElementById('reviewForm');
        if (!form) return;
        if (forceOpen) {
            form.classList.remove('hidden');
        } else {
            form.classList.toggle('hidden');
        }
    }

    async function submitReview(event) {
        event.preventDefault();
        const token = localStorage.getItem('token');
        const rating = document.getElementById('reviewRating').value;
        const comment = document.getElementById('reviewComment').value;
        const msgEl = document.getElementById('reviewFormMessage');

        if (!rating) {
            msgEl.textContent = 'Please select a rating.';
            msgEl.className = 'text-sm ml-3 text-red-400';
            return;
        }

        try {
            const res = await fetch(REVIEWS_API, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({ vid, rating: Number(rating), comment })
            });
            const data = await res.json();

            if (!res.ok) {
                msgEl.textContent = data.error || 'Could not submit review.';
                msgEl.className = 'text-sm ml-3 text-red-400';
                return;
            }

            msgEl.textContent = 'Thanks for your review!';
            msgEl.className = 'text-sm ml-3 text-accent';
            document.getElementById('reviewComment').value = '';
            document.getElementById('reviewRating').value = '';

            // reload so the new review appears immediately, per the spec
            loadReviews();
        } catch (err) {
            console.log(err);
            msgEl.textContent = 'Something went wrong submitting your review.';
            msgEl.className = 'text-sm ml-3 text-red-400';
        }
    }

    const user = JSON.parse(localStorage.getItem('user') || 'null');
    const authArea = document.getElementById('nav-auth-area');
    authArea.innerHTML = user
      ? `<div class="flex items-center gap-3">
           <span class="text-muted">Welcome, ${user.fname}!</span>
           <button onclick="logout()" class="px-4 py-1.5 rounded-full text-sm font-semibold text-circuit border border-circuit/30 bg-circuit/10 hover:bg-circuit/20 transition-colors">Sign Out</button>
         </div>`
      : `<a href="/login.html" class="bg-accent text-bg font-medium px-4 py-1.5 rounded-card hover:opacity-90">Login / Register</a>`;

    function logout() {
        localStorage.removeItem('token');
        localStorage.removeItem('user');
        window.location.href = 'login.html';
    }

    loadVehicle();
    loadReviews();
  </script>

<script src="/chatbot.js"></script>
</body>
</html>
